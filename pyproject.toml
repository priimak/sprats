[project]
name = "sprats"
description = "Some fishy tools"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.1",
]

[build-system]
requires = ["setuptools", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff",
]

[tool.pytest]
minversion = "9.0"
addopts = ["--cov=src", "--cov-report=json", "-ra", "-q", "--strict-markers"]
testpaths = ["tests"]
